plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

def keystorePropertiesFile = file('keystore.properties')
def canSign = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (canSign) keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

android {
    namespace = "app.baldphone.neo"
    compileSdk = 37
    defaultConfig {
        applicationId = "app.baldphone.neo"
        minSdk = 21
        //noinspection OldTargetApi
        targetSdk = 35
        versionCode = 108
        versionName = "15.1.1"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    androidResources {
        generateLocaleConfig = true
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile file('release-key.jks')
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = canSign ? signingConfigs.release : null
            debuggable false
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-" + new Date().format('MMddHHmm')
        }
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17

        coreLibraryDesugaringEnabled = true // java.time for API below 26
    }

    lint {
        abortOnError = false
    }

    sourceSets {
        main {
            assets.srcDir("$buildDir/generated/assets/license")
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.appcompat:appcompat:1.7.1' // Newer versions require minSdk 23+
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.core:core-ktx:1.17.0' // Newer versions require minSdk 23+
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'  // Newer versions require minSdk 23+
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8' // Newer versions require minSdk 24+
    implementation 'androidx.room:room-ktx:2.7.2'  // Newer versions require minSdk 23+
    ksp 'androidx.room:room-compiler:2.7.2'

    implementation 'com.google.android.material:material:1.13.0' // Newer versions require minSdk 23+
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.41'

    implementation 'com.github.bumptech.glide:glide:5.0.5'
    ksp 'com.github.bumptech.glide:ksp:5.0.5'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'io.coil-kt.coil3:coil-android:3.4.0' // Newer versions require minSdk 23+
    implementation 'io.getstream:photoview:1.0.3'
    implementation 'net.danlew:android.joda:2.10.6'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'com.github.blainepwnz:AndroidContacts:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    testImplementation 'junit:junit:4.13.2'
}

tasks.register("copyLicenseToAssets", Copy) {
    from(rootProject.file("LICENSE"))
    into("$buildDir/generated/assets/license")
}

preBuild.dependsOn(copyLicenseToAssets)
