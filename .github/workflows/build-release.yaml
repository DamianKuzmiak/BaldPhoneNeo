name: Build and attach apk to release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    build-release:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Set up Java 17
                uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 17
                    cache: gradle

            -   name: Generate keystore/properties
                env:
                    SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
                    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    for name in SIGNING_KEY_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
                        if [ -z "${!name}" ]; then
                            echo "::error::Secret $name is missing or empty"
                            exit 1
                        fi
                    done
                    echo "$SIGNING_KEY_BASE64" | base64 --decode > app/release-key.jks
                    # Secrets must not contain a backslash
                    {
                        echo "storePassword=$KEYSTORE_PASSWORD"
                        echo "keyAlias=$KEY_ALIAS"
                        echo "keyPassword=$KEY_PASSWORD"
                    } > app/keystore.properties

            -   name: Build release apk
                run: |
                    chmod +x gradlew
                    ./gradlew assembleRelease

            -   name: Attach apk to release
                env:
                    GH_TOKEN: ${{ github.token }}
                    TAG_NAME: ${{ github.event.release.tag_name }}
                run: |
                    cp app/build/outputs/apk/release/*.apk "BaldPhoneNeo-${TAG_NAME}.apk"
                    gh release upload "$TAG_NAME" "BaldPhoneNeo-${TAG_NAME}.apk" --clobber
